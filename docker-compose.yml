services:
  backend:
    build: ./backend
    restart: always
    networks:
      - app-network

  frontend:
    build: ./frontend
    restart: always
    volumes:
      - react-build:/usr/share/nginx/html

  nginx:
    image: nginx:1.23-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - react-build:/usr/share/nginx/html
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app-network

volumes:
  react-build:

networks:
  app-network:
    driver: bridge